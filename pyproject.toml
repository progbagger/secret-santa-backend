[project]
name = "secret-santa-backend"
version = "0.1.0"
description = "Backend service for running Secret Santa games."
readme = "README.md"
authors = [
    { name = "Danil Astakhov", email = "75833312+progbagger@users.noreply.github.com" }
]
requires-python = ">=3.14.4"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.119.0",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn>=0.37.0",
]

[project.scripts]
secret-santa-backend = "secret_santa_backend:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "secret_santa_backend"

[tool.mypy]
exclude = ["^alembic/"]

[dependency-groups]
migration = [
    "alembic>=1.17.2",
]
dev = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pyhamcrest>=2.1.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.16.2",
]

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["arg-type", "misc"]
