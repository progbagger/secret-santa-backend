name: secret-santa-backend

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secret_santa}
      POSTGRES_USER: ${POSTGRES_USER:-secret_santa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_santa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql

  backend:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-secret_santa}:${POSTGRES_PASSWORD:-secret_santa}@postgres:5432/${POSTGRES_DB:-secret_santa}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    command:
      - sh
      - -c
      - alembic upgrade head && exec secret-santa-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
